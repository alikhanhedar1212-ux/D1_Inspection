amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: nav_odom
    base_frame_id: nav_base
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    transform_tolerance: 0.5
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 500
    max_particles: 3000
    max_beams: 120
    laser_model_type: likelihood_field
    laser_min_range: 0.5
    laser_max_range: 20.0
    sigma_hit: 0.15
    z_hit: 0.85
    z_rand: 0.15
    laser_likelihood_max_dist: 2.0
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: true
    save_pose_rate: 0.5
